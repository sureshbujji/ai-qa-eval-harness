name: eval-gate

# Every push/PR runs the LLM-as-judge gate. Without an API key the harness
# runs in mock mode so the pipeline itself is exercised; with a key it
# scores for real and the build fails if the pass rate drops below 80%.
on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run golden evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python src/evaluator.py --min-pass-rate 0.8 --fail-on-critical

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            reports/eval_report.json
            reports/eval_summary.md
